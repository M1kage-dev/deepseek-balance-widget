name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swiftc --version

      - name: Unit tests (logic, config, key resolution)
        run: ./test.sh

      - name: Build universal app
        run: ./build.sh

      - name: Check bundle contents
        run: |
          APP="dist/DeepSeek Balance.app"
          test -x "$APP/Contents/MacOS/DeepSeekBalance"
          test -f "$APP/Contents/Resources/widget.html"
          lipo -info "$APP/Contents/MacOS/DeepSeekBalance"
          codesign -dv "$APP" 2>&1 | head -3

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Balance-app
          path: dist/DeepSeek Balance.app
